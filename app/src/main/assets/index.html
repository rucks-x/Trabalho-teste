<script src="exceljs.min.js"></script><script>window.ExcelJS||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"><\/script>')</script>
<style>
:root{--bg:#f2f5fa;--cd:#fff;--tx:#14213d;--mu:#5b6678;--br:#cfd7e4;--ac:#1f3a63;--bl:#4a90e2;--er:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1520;--cd:#1a2333;--tx:#e8edf6;--mu:#9aa6ba;--br:#2e3a50;--ac:#6fa3e8;--er:#ff7b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1520;--cd:#1a2333;--tx:#e8edf6;--mu:#9aa6ba;--br:#2e3a50;--ac:#6fa3e8;--er:#ff7b6b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Arial,Helvetica,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px 14px 40px}
h1{font-size:19px;margin:8px 0 2px}p.s{margin:0 0 12px;color:var(--mu);font-size:13px}
section{background:var(--cd);border:1px solid var(--br);border-radius:12px;padding:12px;margin:12px 0}
h2{font-size:15px;margin:0 0 8px;color:var(--ac)}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
label b{color:var(--er)}
input,textarea{width:100%;box-sizing:border-box;font:inherit;padding:10px;border:1px solid var(--br);border-radius:8px;background:var(--bg);color:var(--tx)}
input:not([type=file]):not([type=date]),textarea{text-transform:uppercase}
input.bad{border-color:var(--er);box-shadow:0 0 0 1px var(--er)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row{border:1px dashed var(--br);border-radius:8px;padding:8px;margin:8px 0}
.row small{color:var(--mu)}
button{font:inherit;border:0;border-radius:8px;padding:10px 14px;background:var(--ac);color:#fff;cursor:pointer}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) button{color:#0f1520}}
button.l{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button.big{width:100%;padding:14px;font-size:17px;font-weight:bold}
.ph img{max-width:100%;max-height:160px;display:block;margin-top:6px;border-radius:6px}
.tot{font-weight:bold;text-align:right;margin-top:6px}
#msg{margin:10px 0;font-weight:bold}
</style></head><body><main>
<h1>Relatório de Prestação de Serviços</h1><p class="s">Preencha e baixe a planilha pronta. Campos com <span style="color:var(--er)">*</span> são obrigatórios.</p>
<section><h2>Dados do serviço</h2>
<label>Nome do cliente <b>*</b></label><input id="cli">
<div class="g"><div><label>Data do serviço <b>*</b></label><input id="dat" type="date"></div><div><label>N° do serviço <b>*</b></label><input id="nsv"></div></div>
<div class="g"><div><label>N° serviço mês</label><input id="mes"></div><div><label>Nº da ordem</label><input id="ord"></div></div>
<label>Equipamento</label><input id="eqp"></section>
<section><h2>1. Serviço de torno e solda <b style="color:var(--er)">*</b></h2><div id="sv"></div><button class="l" id="asv">+ Adicionar serviço</button><div class="tot" id="tsv"></div></section>
<section><h2>2. Materiais usados</h2><div id="mt"></div><button class="l" id="amt">+ Adicionar material</button><div class="tot" id="tmt"></div></section>
<section><h2>Observação</h2><textarea id="obs" rows="3"></textarea></section>
<section class="ph"><h2>3. Registro fotográfico</h2>
<label>Foto 1 (ex.: peça antes)</label><input type="file" accept="image/*" id="f1"><img id="p1" hidden>
<label>Foto 2 (ex.: serviço concluído)</label><input type="file" accept="image/*" id="f2"><img id="p2" hidden></section>
<div class="tot" id="tot" style="font-size:18px"></div><div id="msg"></div>
<button class="big" id="go">Baixar planilha (.xlsx)</button><button class="big l" id="sh" style="margin-top:8px">Compartilhar (WhatsApp, Excel, etc.)</button></main>
